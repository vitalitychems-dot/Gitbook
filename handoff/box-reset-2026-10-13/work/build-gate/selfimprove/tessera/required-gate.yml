# Target: TESSERA .github/workflows/required-gate.yml
# Helper scripts expected at .github/gate/ (copy from build-gate/selfimprove/scripts/).
# Required status check to set in branch protection: "required-gate / gate".
name: required-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call: {}   # lets rollback-watchdog.yml rerun the whole gate on the main tip

permissions:
  contents: read

concurrency:
  group: required-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  # note: when called via workflow_call the caller's concurrency also applies

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.25.0"
  GITLEAKS_VERSION: "8.30.1"
  # No DATABASE_URL anywhere in this workflow on purpose: suites must run DB-less.

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit (high and above)
        run: pnpm audit --audit-level high

  typecheck-build:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run merge-gate
      - run: pnpm run typecheck
      - run: pnpm run build

  tests:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: scripts
            kind: tap
            dir: scripts
            cmd: node --test --test-reporter=tap ./suite-policy.test.mjs ./historical-merge-gate.test.mjs ./eval/write-result.test.mjs ./check-task-mirror.test.mjs ./rea-registry.test.mjs
          - suite: v2
            kind: tap
            dir: artifacts/v2
            cmd: node --experimental-strip-types --disable-warning=ExperimentalWarning --test --test-reporter=tap test/*.test.mjs
          - suite: gitai
            kind: tap
            dir: artifacts/gitai
            cmd: node --experimental-strip-types --disable-warning=ExperimentalWarning --test --test-reporter=tap test/*.test.mjs
          - suite: api-server
            kind: vitest
            dir: artifacts/api-server
            cmd: pnpm exec vitest run --reporter=default --reporter=json --outputFile=$RUNNER_TEMP/out.json
          - suite: security
            kind: multi
            dir: .
            cmd: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run ${{ matrix.suite }}
        if: matrix.kind != 'multi'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/scores"
          if [ "${{ matrix.kind }}" = tap ]; then
            rc=0; ${{ matrix.cmd }} | tee "$RUNNER_TEMP/out.tap" || rc=$?
            python3 "$GITHUB_WORKSPACE/.github/gate/make_scores.py" --suite ${{ matrix.suite }} --tap "$RUNNER_TEMP/out.tap" --out "$GITHUB_WORKSPACE/scores/${{ matrix.suite }}.json"
          else
            rc=0; ${{ matrix.cmd }} || rc=$?
            python3 "$GITHUB_WORKSPACE/.github/gate/make_scores.py" --suite ${{ matrix.suite }} --vitest "$RUNNER_TEMP/out.json" --out "$GITHUB_WORKSPACE/scores/${{ matrix.suite }}.json"
          fi
          exit $rc
      - name: Security tests (V2-001 denylist, studio denylist, route-inventory, shadow-route-admin-gate)
        if: matrix.kind == 'multi'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p scores; rc=0
          ( cd artifacts/v2 && node --experimental-strip-types --disable-warning=ExperimentalWarning --test --test-reporter=tap \
              test/v2-001-denylist.test.mjs test/v2-066-studio-denylist.test.mjs ) | tee "$RUNNER_TEMP/sec.tap" || rc=1
          ( cd artifacts/api-server && pnpm exec vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/sec.json" \
              src/__tests__/route-inventory.test.ts src/__tests__/shadow-route-admin-gate.test.ts ) || rc=1
          python3 .github/gate/make_scores.py --suite security-denylist --tap "$RUNNER_TEMP/sec.tap" --out scores/security-denylist.json
          python3 .github/gate/make_scores.py --suite security-routes --vitest "$RUNNER_TEMP/sec.json" --out scores/security-routes.json
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scores-${{ matrix.suite }}
          path: scores/
          retention-days: 30

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Commit range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = 0000000000000000000000000000000000000000 ]; then before=$(git rev-parse HEAD~1); fi
            echo "base=$before" >> "$GITHUB_OUTPUT"; echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          # TODO: verify against the release checksums file before trusting the binary.
      - name: gitleaks over range
        run: |
          cfg=""; [ -f .github/gate/gitleaks.toml ] && cfg="--config .github/gate/gitleaks.toml"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner $cfg --log-opts="${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}" .
      - name: Noreply emails on range
        run: bash .github/gate/check_noreply.sh "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"
      - name: No TESSERA_ENABLE_* default-on
        run: python3 .github/gate/check_enable_defaults.py .

  score-drop:
    # (B) Compare against the latest successful main run. On push to main this records the new baseline.
    needs: tests
    if: always() && needs.tests.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read   # to list runs and download the baseline artifact
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "scores-*", path: after, merge-multiple: true }
      - name: Download baseline scores from latest successful main run
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          mkdir -p before
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow required-gate.yml --branch main --event push \
                --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ] && [ "$run" != "$GITHUB_RUN_ID" ]; then
            gh run download "$run" -R "$GITHUB_REPOSITORY" --pattern 'scores-*' --dir before || echo "baseline download failed"
            echo "BASE_RUN=$run" >> "$GITHUB_ENV"
          fi
      - name: PR body (for removed-tests:)
        if: github.event_name == 'pull_request'
        env: { PR_BODY: "${{ github.event.pull_request.body }}" }
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: Compare scores
        run: |
          echo "Baseline run: ${BASE_RUN:-none}" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/gate/compare_scores.py --before before --after after \
            --pr-body "$RUNNER_TEMP/pr-body.md" --summary "$GITHUB_STEP_SUMMARY"
      # Bench: only if scripts/bench-latency.mjs exists. 5 runs on base and head, median; up to 3 reruns on failure.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: github.event_name == 'pull_request' && hashFiles('scripts/bench-latency.mjs') != ''
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'pull_request' && hashFiles('scripts/bench-latency.mjs') != ''
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - name: Bench (median of 5, >5% worse fails after 3 reruns)
        if: github.event_name == 'pull_request' && hashFiles('scripts/bench-latency.mjs') != ''
        shell: bash
        run: |
          set -e
          gate="$RUNNER_TEMP/gate"; cp -r .github/gate "$gate"
          bench() { # $1=out dir
            mkdir -p "$1"; pnpm install --frozen-lockfile --ignore-scripts >/dev/null
            [ -f scripts/bench-latency.mjs ] || return 0
            for i in 1 2 3 4 5; do node scripts/bench-latency.mjs --out "$1/run$i.json" >/dev/null; done
          }
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/bb" "$RUNNER_TEMP/ba"
            git checkout -q "${{ github.event.pull_request.base.sha }}"; bench "$RUNNER_TEMP/bb"
            git checkout -q "${{ github.event.pull_request.head.sha }}"; bench "$RUNNER_TEMP/ba"
            if ! ls "$RUNNER_TEMP/bb"/run*.json >/dev/null 2>&1; then echo "No bench on base; skipping."; exit 0; fi
            if python3 "$gate/bench_compare.py" --before "$RUNNER_TEMP"/bb/run*.json --after "$RUNNER_TEMP"/ba/run*.json \
                 --threshold 0.05 --summary "$GITHUB_STEP_SUMMARY"; then exit 0; fi
            echo "Bench regression on attempt $attempt"
          done
          echo "Bench >5% worse on 3 attempts" >> "$GITHUB_STEP_SUMMARY"; exit 1

  gate:
    # Single required check. Red if any upstream job failed or was skipped unexpectedly.
    needs: [install, typecheck-build, tests, hygiene, score-drop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All gates green
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; n=json.load(sys.stdin); bad={k:v['result'] for k,v in n.items() if v['result']!='success'}; print(bad or 'all green'); sys.exit(1 if bad else 0)"
