# Target: Gitbook .github/workflows/required-gate.yml
# Helper scripts expected at .github/gate/ (check_links.py, check_tables.py, check_noreply.sh).
# Required status check to set in branch protection: "required-gate / gate".
name: required-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Changed files
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then base="${{ github.event.pull_request.base.sha }}"; else
            base="${{ github.event.before }}"; [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] && base=$(git rev-parse HEAD~1); fi
          git diff --name-only --diff-filter=AMR "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/changed.txt"
      - name: SUMMARY.md and changed .md relative links resolve
        run: |
          files="SUMMARY.md $(grep -E '\.md$' "$RUNNER_TEMP/changed.txt" | grep -v '^archive/' | tr '\n' ' ')"
          python3 .github/gate/check_links.py --root . $files
      - name: Intake log and ledger tables (column counts, unique IDs)
        run: |
          files=$(ls intake/log.md mesh/ledger/*.md 2>/dev/null || true)
          [ -n "$files" ] && python3 .github/gate/check_tables.py $files || echo "no tables to check"

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"; echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            b="${{ github.event.before }}"; [ -z "$b" ] || [ "$b" = 0000000000000000000000000000000000000000 ] && b=$(git rev-parse HEAD~1)
            echo "base=$b" >> "$GITHUB_OUTPUT"; echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install gitleaks
        run: curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks over range
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}" .'
      - name: Noreply emails
        run: bash .github/gate/check_noreply.sh "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

  qlab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then base="${{ github.event.pull_request.base.sha }}"; else
            base="${{ github.event.before }}"; [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] && base=$(git rev-parse HEAD~1); fi
          if git diff --name-only "$base" HEAD | grep -q '^tools/qlab/'; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.changed.outputs.run == '1'
        with: { python-version: "3.12" }
      - name: qlab tests (fast set; test_aqft*.py are excluded by qlab itself and take ~8-13 min)
        if: steps.changed.outputs.run == '1'
        working-directory: tools/qlab
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install numpy; fi
          python3 -m qlab test

  gate:
    needs: [docs, hygiene, qlab]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; n=json.load(sys.stdin); bad={k:v['result'] for k,v in n.items() if v['result']!='success'}; print(bad or 'all green'); sys.exit(1 if bad else 0)"
