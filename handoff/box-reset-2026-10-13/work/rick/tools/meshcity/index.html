<script>
const C=JSON.parse(document.getElementById('city').textContent),cv=document.getElementById('c'),g=cv.getContext('2d'),info=document.getElementById('i');
let yaw=0.7,pitch=0.6,dist=55,W,H,drag=null,hits=[];
const col={agent:'#4fa3ff',workshop:'#ffb347',library:'#9f7bff'};
const gnd={green:'#123d22',amber:'#4a3a10',red:'#4a1414',unknown:'#222'}[(C.ground||{}).level||'unknown'];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;draw()}
function P(x,y,z){x-=10;z-=10;const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 let X=x*cy-z*sy,Z=x*sy+z*cy,Y=y*cp-Z*sp;Z=y*sp+Z*cp+dist;const f=600/Z;return [W/2+X*f,H/2-Y*f,Z]}
function shade(h,k){const n=parseInt(h.slice(1),16);return `rgb(${(n>>16)*k|0},${(n>>8&255)*k|0},${(n&255)*k|0})`}
function draw(){g.fillStyle='#0b0f14';g.fillRect(0,0,W,H);
 const q=[[-4,0,-4],[34,0,-4],[34,0,30],[-4,0,30]].map(p=>P(...p));g.fillStyle=gnd;g.beginPath();q.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.fill();
 const bs=(C.buildings||[]).map(b=>({b,d:P(b.x+1,0,b.z+1)[2]})).sort((a,b)=>b.d-a.d);hits=[];
 for(const {b} of bs){const x=b.x,z=b.z,h=b.height,s=2,c=col[b.kind]||'#aaa';
  const v=[[x,0,z],[x+s,0,z],[x+s,0,z+s],[x,0,z+s],[x,h,z],[x+s,h,z],[x+s,h,z+s],[x,h,z+s]].map(p=>P(...p));
  const F=[[0,1,5,4,.8],[1,2,6,5,.6],[2,3,7,6,.5],[3,0,4,7,.7],[4,5,6,7,1]];
  F.map(f=>({f,z:(v[f[0]][2]+v[f[1]][2]+v[f[2]][2]+v[f[3]][2])/4})).sort((a,b)=>b.z-a.z).forEach(({f})=>{
   g.fillStyle=shade(c,f[4]);g.beginPath();for(let i=0;i<4;i++){const p=v[f[i]];i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.closePath();g.fill();g.strokeStyle='#0006';g.stroke()});
  const xs=v.map(p=>p[0]),ys=v.map(p=>p[1]);hits.push({b,x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)});
  if(b.kind==='agent'){g.fillStyle='#fff';g.fillText(b.name,v[4][0],v[4][1]-4)}}
 g.fillStyle='#ccc';g.fillText(`disk ${(C.ground||{}).percent??'unknown'}% (${(C.ground||{}).level}) | blue=agents orange=workshops purple=library`,10,H-10)}
cv.onmousedown=e=>drag=[e.clientX,e.clientY,0];onmouseup=e=>{if(drag&&drag[2]<4)pick(e);drag=null};
onmousemove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;pitch=Math.max(.1,Math.min(1.5,pitch+(e.clientY-drag[1])*.01));drag[2]+=Math.abs(e.clientX-drag[0])+Math.abs(e.clientY-drag[1]);drag[0]=e.clientX;drag[1]=e.clientY;draw()};
onwheel=e=>{dist=Math.max(15,Math.min(150,dist+e.deltaY*.05));draw()};
function pick(e){for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(e.clientX>=h.x0&&e.clientX<=h.x1&&e.clientY>=h.y0&&e.clientY<=h.y1){const b=Object.assign({},h.b);info.textContent=JSON.stringify(b,null,1);return}}}
onresize=rs;rs();
</script></body></html>
